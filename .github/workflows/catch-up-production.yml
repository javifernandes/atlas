name: Catch Up Production Merges

on:
  workflow_dispatch:
    inputs:
      since:
        description: Include merged PRs on or after this ISO-8601 timestamp
        required: true
        default: '2026-09-07T00:00:00Z'
        type: string
      apply:
        description: Apply missing Session activity after the preview
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production-merge-catch-up
  cancel-in-progress: false

jobs:
  catch-up:
    name: Preview or apply merge catch-up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    env:
      ATLAS_GITHUB_APP_ID: ${{ secrets.ATLAS_GITHUB_APP_ID }}
      ATLAS_GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.ATLAS_GITHUB_APP_PRIVATE_KEY_BASE64 }}
      ATLAS_GITHUB_REPOSITORY: javifernandes/atlas
      CATCH_UP_SINCE: ${{ inputs.since }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production configuration
        run: |
          if [[ -z "${DATABASE_URL_UNPOOLED:-}" ]]; then
            echo '::error::Production environment secret DATABASE_URL_UNPOOLED is not configured'
            exit 1
          fi

          if [[ "$DATABASE_URL_UNPOOLED" == *"-pooler."* ]]; then
            echo '::error::DATABASE_URL_UNPOOLED must be a direct, non-pooled PostgreSQL connection'
            exit 1
          fi

          if ! node -e '
            process.exit(Number.isFinite(Date.parse(process.env.CATCH_UP_SINCE ?? "")) ? 0 : 1);
          '; then
            echo '::error::Workflow input since must be a valid ISO-8601 timestamp'
            exit 1
          fi

          if [[ ! "${ATLAS_GITHUB_APP_ID:-}" =~ ^[0-9]+$ ]]; then
            echo '::error::Production environment secret ATLAS_GITHUB_APP_ID is missing or invalid'
            exit 1
          fi

          if ! node -e '
            const encoded = process.env.ATLAS_GITHUB_APP_PRIVATE_KEY_BASE64 ?? "";
            const pem = Buffer.from(encoded, "base64").toString("utf8");
            process.exit(/-----BEGIN (?:RSA )?PRIVATE KEY-----/.test(pem) ? 0 : 1);
          '; then
            echo '::error::Production environment secret ATLAS_GITHUB_APP_PRIVATE_KEY_BASE64 is missing or invalid'
            exit 1
          fi

      - name: Apply and verify schema
        run: |
          pnpm db:migrate
          pnpm db:verify

      - name: Preview merge catch-up
        if: ${{ !inputs.apply }}
        run: pnpm db:catch-up -- --since="$CATCH_UP_SINCE"

      - name: Apply merge catch-up
        if: ${{ inputs.apply }}
        run: pnpm db:catch-up -- --since="$CATCH_UP_SINCE" --apply
