name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify change
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA" --

          changed_count="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- | awk 'END { print NR + 0 }')"
          non_markdown_count="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- | awk 'tolower($0) !~ /\.md$/ { count++ } END { print count + 0 }')"

          if [[ "$changed_count" -gt 0 && "$non_markdown_count" -eq 0 ]]; then
            echo "markdown_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "markdown_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Markdown sources
        if: steps.changes.outputs.markdown_only == 'true'
        run: >-
          pnpm exec vitest run
          src/atlas/markdown/build-snapshot.test.ts
          src/atlas/sources/markdown-source.test.ts

      - name: Test
        if: steps.changes.outputs.markdown_only != 'true'
        run: pnpm test

      - name: Typecheck
        if: steps.changes.outputs.markdown_only != 'true'
        run: pnpm typecheck

      - name: Build
        if: steps.changes.outputs.markdown_only != 'true'
        run: pnpm build
        env:
          ATLAS_SOURCES_YAML: |
            version: 1
            sources: {}
